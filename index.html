<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">THE GAMEHUB | المحرك الذكي</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #000; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow-x: hidden; 
        }

        .glow-box {
            position: relative; border-radius: 25px; padding: 3px;
            animation: border-glow 4s linear infinite;
        }

        .search-card { 
            background: #0a0a0a; padding: 25px; border-radius: 22px; 
            border: 2px solid #00ffcc; width: 90%; max-width: 420px; 
            text-align: center; position: relative; 
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }

        .lang-switcher { position: absolute; top: 15px; left: 15px; display: flex; gap: 5px; }
        .lang-btn { background: #111; color: #00ffcc; border: 1px solid #333; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; }
        .lang-btn.active { background: #00ffcc; color: #000; border-color: #00ffcc; font-weight: bold; }

        h1 { color: #00ffcc; font-size: 2.2rem; margin: 40px 0 20px; text-shadow: 0 0 10px #00ffcc; font-weight: 900; }

        .section-title { font-size: 0.85rem; color: #00ffcc; margin: 12px 0 8px; display: block; font-weight: bold; text-align: right; border-right: 3px solid #00ffcc; padding-right: 10px; }

        .site-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 15px; }
        
        .site-btn { background: #111; color: #666; border: 1px solid #222; padding: 10px 4px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; transition: 0.3s; }
        .site-btn.active { background: #00ffcc; color: #000; border-color: #00ffcc; font-weight: bold; }

        .input-box { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #333; background: #000; color: #fff; font-size: 1rem; outline: none; transition: 0.3s; box-sizing: border-box; }
        .input-box:focus { border-color: #00ffcc; }

        #errorMsg {
            color: #ff4444; font-size: 0.85rem; margin-top: 5px; margin-bottom: 10px;
            height: 20px; opacity: 0; transition: 0.3s; font-weight: bold;
        }

        .search-btn { background: #00ffcc; color: #000; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes border-glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="glow-box">
        <div class="search-card">
            <div class="lang-switcher">
                <button class="lang-btn active" onclick="setLanguage('ar')">العربية</button>
                <button class="lang-btn" onclick="setLanguage('en')">EN</button>
                <button class="lang-btn" onclick="setLanguage('fr')">FR</button>
            </div>

            <h1>THE GAMEHUB</h1>
            
            <span class="section-title" id="txtMobile">ألعاب الهاتف (Android)</span>
            <div class="site-grid">
                <button class="site-btn" onclick="selectSite('apkmirror', this)">APK Mirror</button>
                <button class="site-btn" onclick="selectSite('liteapks', this)">LiteAPKs</button>
                <button class="site-btn" onclick="selectSite('uptodown', this)">Uptodown</button>
            </div>

            <span class="section-title" id="txtPC">ألعاب مكركة (PC)</span>
            <div class="site-grid">
                <button class="site-btn active" onclick="selectSite('wifi4games', this)">Wifi4Games</button>
                <button class="site-btn" onclick="selectSite('elamigos', this)">ElAmigos</button>
                <button class="site-btn" onclick="selectSite('fitgirl', this)">FitGirl</button>
            </div>

            <span class="section-title" id="txtOriginal">ألعاب أصلية (Official)</span>
            <div class="site-grid">
                <button class="site-btn" onclick="selectSite('steam', this)">Steam</button>
                <button class="site-btn" onclick="selectSite('epic', this)">Epic Games</button>
                <button class="site-btn" onclick="selectSite('gog', this)">GOG</button>
            </div>

            <input type="text" id="gameQuery" class="input-box" placeholder="... اكتب اسم اللعبة" autocomplete="off">
            <div id="errorMsg">الرجاء كتابة اسم اللعبة!</div>

            <button class="search-btn" id="txtBtn" onclick="executeSearch()">بحث سريع 🚀</button>
        </div>
    </div>

    <script>
        let currentLang = 'ar';
        let selectedSite = 'wifi4games';

        const dictionary = {
            ar: { mobile: "ألعاب الهاتف (Android)", pc: "ألعاب مكركة (PC)", original: "ألعاب أصلية (Official)", placeholder: "... اكتب اسم اللعبة", btn: "بحث سريع 🚀", error: "الرجاء كتابة اسم اللعبة!" },
            en: { mobile: "Mobile Games (Android)", pc: "Cracked PC Games", original: "Official Stores", placeholder: "Type game name...", btn: "Quick Search 🚀", error: "Please type a game name!" },
            fr: { mobile: "Jeux Mobile (Android)", pc: "Jeux PC Crackés", original: "Stores Officiels", placeholder: "Nom du jeu...", btn: "Recherche 🚀", error: "Veuillez taper le nom du jeu!" }
        };

        function setLanguage(lang) {
            currentLang = lang;
            const data = dictionary[lang];
            document.getElementById('mainHtml').dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('txtMobile').innerText = data.mobile;
            document.getElementById('txtPC').innerText = data.pc;
            document.getElementById('txtOriginal').innerText = data.original;
            document.getElementById('gameQuery').placeholder = data.placeholder;
            document.getElementById('txtBtn').innerText = data.btn;
            document.getElementById('errorMsg').innerText = data.error;
            
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function selectSite(site, btn) {
            selectedSite = site;
            document.querySelectorAll('.site-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function executeSearch() {
            const query = document.getElementById('gameQuery').value;
            const errorElement = document.getElementById('errorMsg');

            if (!query) {
                errorElement.style.opacity = "1";
                errorElement.style.animation = "shake 0.3s ease-in-out";
                setTimeout(() => {
                    errorElement.style.opacity = "0";
                    errorElement.style.animation = "none";
                }, 2000);
                return;
            }
            
            let url = "";
            switch(selectedSite) {
                case 'liteapks': url = `https://liteapks.com/?s=${query}`; break;
                case 'apkmirror': url = `https://www.apkmirror.com/?post_type=app_release&searchtype=apk&bundles%5B%5D=apkm_bundles&bundles%5B%5D=apk_files&s=${query}`; break;
                case 'uptodown': url = `https://en.uptodown.com/android/search?query=${query}`; break;
                case 'wifi4games': url = `https://www.wifi4games.com/search/${query}`; break;
                case 'elamigos': url = `https://www.google.com/search?q=site:elamigos.site+${query}`; break;
                case 'fitgirl': url = `https://fitgirl-repacks.site/?s=${query}`; break;
                case 'steam': url = `https://store.steampowered.com/search/?term=${query}`; break;
                case 'epic': url = `https://store.epicgames.com/en-US/browse?q=${query}`; break;
                case 'gog': url = `https://www.gog.com/en/games?query=${query}&order=desc:score`; break;
            }
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
