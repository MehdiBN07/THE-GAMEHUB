<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">ORBIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Tajawal:wght@200;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --orbit-blue: #00d2ff; 
            --orbit-purple: #925cff; 
            --space-black: #02040a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body { 
            margin: 0; padding: 0; 
            background: var(--space-black);
            background: radial-gradient(circle at center, #0b1121 0%, #02040a 100%);
            color: white; 
            font-family: 'Tajawal', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow-x: hidden;
        }

        .orbit-container {
            width: 90%; max-width: 480px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 50px 35px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            position: relative;
            text-align: center;
            border-bottom: 2px solid var(--orbit-blue);
            display: flex; flex-direction: column; align-items: center;
        }

        .social-link { position: absolute; top: 30px; right: 30px; color: var(--orbit-blue); font-size: 1.5rem; transition: 0.4s; }
        .social-link:hover { transform: rotate(360deg) scale(1.2); color: #fff; text-shadow: 0 0 15px var(--orbit-blue); }

        .lang-switcher { position: absolute; top: 30px; left: 30px; display: flex; gap: 5px; }
        .lang-btn { 
            background: rgba(255,255,255,0.05); color: #888; border: 1px solid var(--border); 
            padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.7rem; transition: 0.3s;
        }
        .lang-btn.active { background: var(--orbit-blue); color: #000; font-weight: bold; border-color: var(--orbit-blue); }

        /* العنوان الجديد المحدث */
        h1 { 
            font-family: 'Orbitron', sans-serif; font-size: 3.5rem; margin: 30px 0;
            background: linear-gradient(to right, #fff, var(--orbit-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 10px; font-weight: 900; filter: drop-shadow(0 0 10px rgba(0,210,255,0.3));
        }

        .category-label { 
            width: 100%; font-size: 0.75rem; color: var(--orbit-blue); margin: 30px 0 15px; 
            text-transform: uppercase; letter-spacing: 2px; font-weight: 700;
            display: flex; align-items: center; gap: 15px;
        }
        .category-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

        .grid-system { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
        
        .grid-btn { 
            background: rgba(255, 255, 255, 0.02); color: #bbb; border: 1px solid var(--border);
            padding: 18px 5px; border-radius: 16px; cursor: pointer; font-size: 0.8rem;
            transition: 0.3s; font-weight: 400; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
        }
        .grid-btn:hover, .grid-btn.active { background: rgba(0, 210, 255, 0.05); border-color: var(--orbit-blue); color: #fff; transform: translateY(-3px); }

        .ai-pulse-btn { 
            grid-column: span 3; background: linear-gradient(90deg, rgba(146,92,255,0.15), rgba(0,210,255,0.15));
            border-color: var(--orbit-purple); color: #fff; font-weight: 700; font-size: 1rem;
            box-shadow: 0 0 20px rgba(146,92,255,0.2);
        }

        .search-engine { width: 100%; margin-top: 35px; display: flex; flex-direction: column; align-items: center; }

        .orbit-input { 
            width: 100%; max-width: 400px; padding: 22px; border-radius: 20px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.5); color: #fff; font-size: 1rem; outline: none;
            transition: 0.4s; text-align: center;
        }
        .orbit-input:focus { border-color: var(--orbit-blue); background: #000; box-shadow: 0 0 25px rgba(0,210,255,0.1); }

        .orbit-search-btn { 
            width: 100%; max-width: 400px; background: linear-gradient(45deg, var(--orbit-blue), var(--orbit-purple));
            color: white; border: none; padding: 22px; border-radius: 20px;
            font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.4s;
            margin-top: 15px; letter-spacing: 1px;
        }
        .orbit-search-btn:hover { transform: scale(1.02); filter: brightness(1.1); box-shadow: 0 10px 30px rgba(146,92,255,0.3); }

        .orbit-footer { width: 100%; margin-top: 50px; padding-top: 25px; border-top: 1px solid var(--border); }
        .orbit-copy { font-size: 0.65rem; color: #555; font-weight: 200; letter-spacing: 2px; text-transform: uppercase; }

        @media (min-width: 1024px) {
            .orbit-container { max-width: 900px; padding: 70px; }
            h1 { font-size: 5rem; }
            .grid-btn { padding: 25px; font-size: 1rem; }
        }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    </style>
</head>
<body id="bodyTag">

    <div class="orbit-container">
        <a href="https://www.instagram.com/the_gamehub_official" target="_blank" class="social-link"><i class="fab fa-instagram"></i></a>
        
        <div class="lang-switcher">
            <button id="arBtn" class="lang-btn active" onclick="setLanguage('ar', this)">العربية</button>
            <button id="enBtn" class="lang-btn" onclick="setLanguage('en', this)">EN</button>
            <button id="frBtn" class="lang-btn" onclick="setLanguage('fr', this)">FR</button>
        </div>

        <h1>ORBIT</h1>

        <span class="category-label" id="txtMobile">بوابات الهاتف (Android)</span>
        <div class="grid-system">
            <button class="grid-btn" onclick="selectSite('apkmirror', this)">APK Mirror</button>
            <button class="grid-btn" onclick="selectSite('liteapks', this)">LiteAPKs</button>
            <button class="grid-btn" onclick="selectSite('uptodown', this)">Uptodown</button>
        </div>

        <span class="category-label" id="txtPC">ألعاب الحاسوب (Cracked)</span>
        <div class="grid-system">
            <button class="grid-btn active" onclick="selectSite('wifi4games', this)">Wifi4Games</button>
            <button class="grid-btn" onclick="selectSite('elamigos', this)">ElAmigos</button>
            <button class="grid-btn" onclick="selectSite('fitgirl', this)">FitGirl</button>
        </div>

        <span class="category-label" id="txtOriginal">المتاجر الرسمية (Official)</span>
        <div class="grid-system">
            <button class="grid-btn" onclick="selectSite('steam', this)">Steam</button>
            <button class="grid-btn" onclick="selectSite('epic', this)">Epic Games</button>
            <button class="grid-btn" onclick="selectSite('gog', this)">GOG</button>
        </div>

        <span class="category-label" id="txtAI">الذكاء الاصطناعي MIRAGE AI</span>
        <div class="grid-system">
            <a href="https://mehdibn07.github.io/AI/" target="_blank" class="grid-btn ai-pulse-btn" id="linkAI">
                <i class="fas fa-brain"></i> &nbsp; MIRAGE AI SYSTEM
            </a>
        </div>

        <span class="category-label" id="txtMini">الألعاب المصغرة</span>
        <div class="grid-system">
            <a href="https://mehdibn07.github.io/Mouse-Hunter/" target="_blank" class="grid-btn">صائد الفئران</a>
            <a href="https://mehdibn07.github.io/Ludo/" target="_blank" class="grid-btn">LUDO</a>
        </div>

        <div class="search-engine">
            <input type="text" id="gameQuery" class="orbit-input" placeholder="... ابحث في المدار" autocomplete="off">
            <div id="errorMsg" style="color: #ff4d4d; font-size: 0.75rem; margin-top: 10px; opacity: 0; height: 15px;">الرجاء كتابة اسم اللعبة!</div>
            <button class="orbit-search-btn" id="txtBtn" onclick="executeSearch()">فحص المدار 📡</button>
        </div>

        <div class="orbit-footer">
            <div class="orbit-copy" id="txtCopyright">
                جميع الحقوق محفوظة لدى ORBIT © 2026
            </div>
        </div>
    </div>

    <script>
        // كود تنظيف الرابط من أكواد تتبع إنستغرام تلقائياً
        window.onload = function() {
            if (window.location.search.length > 0) {
                var clean_uri = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.replaceState({}, document.title, clean_uri);
            }
        }

        let currentLang = 'ar';
        let selectedSite = 'wifi4games';
        const dictionary = {
            ar: { mobile: "بوابات الهاتف (Android)", pc: "ألعاب الحاسوب (Cracked)", original: "المتاجر الرسمية (Official)", ai: "الذكاء الاصطناعي MIRAGE AI", mini: "الألعاب المصغرة", placeholder: "... ابحث في المدار", btn: "فحص المدار 📡", error: "الرجاء كتابة اسم اللعبة!", copy: "جميع الحقوق محفوظة لدى ORBIT © 2026" },
            en: { mobile: "Mobile Gateways (Android)", pc: "PC Games (Cracked)", original: "Official Stores", ai: "MIRAGE AI SYSTEM", mini: "Mini Games", placeholder: "Search in orbit...", btn: "Scan Orbit 📡", error: "Please enter a game name!", copy: "All Rights Reserved to ORBIT © 2026" },
            fr: { mobile: "Passerelles Mobile", pc: "Jeux PC (Crackés)", original: "Stores Officiels", ai: "MIRAGE IA SYSTÈME", mini: "Mini Jeux", placeholder: "Chercher en orbite...", btn: "Scanner l'Orbite 📡", error: "Veuillez entrer un nom!", copy: "Tous droits réservés à ORBIT © 2026" }
        };

        function setLanguage(lang, btn) {
            currentLang = lang;
            const data = dictionary[lang];
            const htmlTag = document.getElementById('mainHtml');
            htmlTag.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('txtMobile').innerText = data.mobile;
            document.getElementById('txtPC').innerText = data.pc;
            document.getElementById('txtOriginal').innerText = data.original;
            document.getElementById('txtAI').innerText = data.ai;
            document.getElementById('txtMini').innerText = data.mini;
            document.getElementById('gameQuery').placeholder = data.placeholder;
            document.getElementById('txtBtn').innerText = data.btn;
            document.getElementById('txtCopyright').innerText = data.copy;

            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function selectSite(site, btn) {
            selectedSite = site;
            document.querySelectorAll('.grid-system:not(:last-of-type) .grid-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function executeSearch() {
            const query = document.getElementById('gameQuery').value;
            const errorElement = document.getElementById('errorMsg');
            if (!query) { 
                errorElement.style.opacity = "1"; 
                errorElement.style.animation = "shake 0.3s ease-in-out"; 
                setTimeout(() => { errorElement.style.opacity = "0"; errorElement.style.animation = "none"; }, 2000); 
                return; 
            }
            let url = "";
            switch(selectedSite) {
                case 'liteapks': url = `https://liteapks.com/?s=${query}`; break;
                case 'apkmirror': url = `https://www.apkmirror.com/?post_type=app_release&searchtype=apk&bundles%5B%5D=apkm_bundles&bundles%5B%5D=apk_files&s=${query}`; break;
                case 'uptodown': url = `https://en.uptodown.com/android/search?query=${query}`; break;
                case 'wifi4games': url = `https://www.wifi4games.com/search/${query}`; break;
                case 'elamigos': url = `https://www.google.com/search?q=site:elamigos.site+${query}`; break;
                case 'fitgirl': url = `https://fitgirl-repacks.site/?s=${query}`; break;
                case 'steam': url = `https://store.steampowered.com/search/?term=${query}`; break;
                case 'epic': url = `https://store.epicgames.com/en-US/browse?q=${query}`; break;
                case 'gog': url = `https://www.gog.com/en/games?query=${query}&order=desc:score`; break;
            }
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
